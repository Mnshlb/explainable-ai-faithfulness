[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-report"
version = "2.0.0"
description = "Explaining every prediction of three classifiers with LIME, SHAP, prototypes and Grad-CAM"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
xai-run = "xai.run:main"
xai-explain = "xai.explain_one:main"
xai-report = "xai.report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
